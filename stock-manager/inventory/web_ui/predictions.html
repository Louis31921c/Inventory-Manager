 <meta charset="utf-8">
<title>DDMRP</title>
<style>
  @font-face {
    font-display: swap;
    font-family: "Cascadia Mono Web";
    font-weight: 200 700;
    src: url("/fonts/CascadiaMono.woff2") format("woff2-variations"),
         url("/fonts/CascadiaMono.woff2") format("woff2");
  }

  :root {
    --ground: #000000;
    --surface-2: #030a05;
    --ink: #39ff14;
    --bright: #7dff5c;
    --muted: #1c9c10;
    --line: #10600a;
    --line-strong: #1c9c10;
    --green-soft: #08240a;
    --accent-soft: #08240a;
    --alarm: #ffb000;
    --ral9003: #f4f4f4;
    --ral9016: #fbfdfd;
    --head-wash: rgba(251, 253, 253, .30);
    --mono: "Cascadia Mono Web", "Cascadia Mono", "Cascadia Code", "DejaVu Sans Mono",
            ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 auto;
    max-width: 1100px;
    padding: 0 16px 40px;
  }
  h1, h2 { font-weight: 700; margin: 0; }
  h1 { font-size: 19px; text-transform: uppercase; }
  h2 { color: var(--bright); font-size: 15px; }
  h2::before { color: var(--ink); content: "> "; }
  p { margin: 0; }

  header.page {
    align-items: baseline; border-bottom: 1px solid var(--line); display: flex;
    flex-wrap: wrap; gap: 4px 12px; margin-bottom: 14px; padding-block: 16px 9px;
  }
  header.page .count { color: var(--muted); font-size: 12px; }
  .grow { flex: 1 1 auto; }

  [hidden] { display: none !important; }
  .cards { display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--line-strong); padding: 14px 16px; }
  .card > * + * { margin-top: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row.tight { gap: 6px; }
  .side-by-side { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 820px) { .side-by-side { grid-template-columns: 1fr; } }

  button.action {
    background: var(--accent-soft); border: 1px solid var(--ink); color: var(--ink);
    cursor: pointer; font-family: var(--mono); font-size: 14px; font-weight: 500;
    padding: 7px 14px; text-transform: uppercase;
  }
  button.action::before { content: "> "; }
  button.action:hover { background: var(--ink); color: #000; }
  button.action.ghost { background: none; border-color: var(--line-strong); color: var(--muted); }
  button.action.ghost:hover { border-color: var(--ink); color: var(--ink); }
  button.action[disabled] { cursor: not-allowed; opacity: .4; }

  .mini {
    background: none; border: 1px solid var(--line-strong); color: var(--muted); cursor: pointer;
    font-family: var(--mono); font-size: 12px; padding: 2px 8px;
  }
  .mini:hover { background: var(--ink); border-color: var(--ink); color: #000; }
  .mini[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
  .mini[aria-pressed="true"]::before { content: "> "; }
  a.mini { display: inline-block; text-decoration: none; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  label.field { display: flex; flex-direction: column; gap: 2px; }
  label.field > span {
    color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
  label.field > span::before { color: var(--ink); content: "$ "; }
  input, select {
    background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--bright);
    font-family: var(--mono); font-size: 14px; padding: 7px 9px; width: 100%;
  }
  input:not([type]), input[type="text"], input[type="search"] { text-transform: uppercase; }
  input:focus, select:focus { border-color: var(--ink); outline: none; }

  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  .scroll-x { overflow-x: auto; }
  .short-box { max-height: 260px; overflow-y: auto; }
  .short-box thead th { background: var(--ground); position: sticky; top: 0; }
  th {
    background: var(--head-wash); border-bottom: 1px solid var(--line-strong);
    color: var(--ral9016); font-size: 11px; font-weight: 700; letter-spacing: .1em;
    padding: 5px 12px 5px 8px; text-align: left; text-transform: uppercase; white-space: nowrap;
  }
  td { padding: 4px 12px 4px 0; vertical-align: top; }
  td.num {
    font-variant-numeric: tabular-nums; padding-right: 16px; text-align: right;
    white-space: nowrap;
  }
  tbody tr:hover { background: var(--green-soft); }
  tbody strong { color: var(--bright); font-weight: 700; }
  tfoot th {
    border-bottom: 0; border-top: 1px solid var(--line-strong); color: var(--ink);
    padding-top: 6px;
  }
  .desig { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }

  input.cell {
    background: none; border: 1px solid transparent; color: var(--ink); font: inherit;
    padding: 1px 4px; text-align: right; width: 84px;
  }
  input.cell:hover { border-color: var(--line); }
  input.cell:focus { background: var(--surface-2); border-color: var(--ink); outline: none; }
  input.cell.saved { border-color: var(--ink); }

  .pill {
    border: 1px solid currentColor; display: inline-block; font-size: 10.5px;
    letter-spacing: .08em; padding: 0 5px; text-transform: uppercase;
  }
  .pill.red { color: #ff6b5e; }
  .pill.yellow { color: #ffb000; }
  .pill.green { color: var(--ink); }
  .pill.over, .pill.uncounted { color: var(--muted); }

  .notice { border-left: 2px solid var(--line-strong); font-size: 13px; padding: 6px 10px; }
  .notice::before { color: var(--ink); content: "> "; }
  .notice.warn { border-color: var(--alarm); color: var(--alarm); }
  .notice.bad { border-color: var(--ink); color: var(--ink); }
  .notice.bad::before { content: "[x] "; }
  .muted { color: var(--muted); }
  .legend { color: var(--muted); font-size: 11.5px; }

  svg { display: block; width: 100%; }
  svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
  svg text.value { fill: var(--bright); }
  svg .axis { stroke: var(--line); stroke-width: 1; }
  svg rect.bar { fill: var(--ink); }
  svg rect.track { fill: var(--surface-2); stroke: var(--line); }

  .fkeys {
    border-top: 1px solid var(--line-strong); display: flex; flex-wrap: wrap; gap: 2px 18px;
    margin-top: 14px; padding-top: 6px;
  }
  .fkey {
    background: none; border: 0; color: var(--ink); cursor: pointer; font-family: var(--mono);
    font-size: 13px; padding: 1px 0; white-space: nowrap;
  }
  .fkey b { background: var(--ink); color: #000; font-weight: 400; padding: 0 3px; }
  .fkey span { color: var(--ral9003); }
  .fkey:hover span, .fkey:focus-visible span { text-decoration: underline; }

  .spin { animation: spin 1s steps(8) infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>

<header class="page">
  <h1>DDMRP</h1>
  <span class="grow"></span>
  <button class="mini" id="reload">refresh</button>
</header>

<div id="top-notice"></div>

<div class="cards">
  <div class="side-by-side">
    <div class="card">
      <h2>OUTPUTS</h2>
      <div id="weeks-chart"></div>
    </div>
    <div class="card">
      <h2>SITE</h2>
      <div id="sites-chart"></div>
    </div>
  </div>

  <div class="card">
    <h2>FLOW</h2>
    <div class="row tight">
      <button class="mini period" id="period-week" aria-pressed="true">per week</button>
      <button class="mini period" id="period-month" aria-pressed="false">per month</button>
      <button class="mini period" id="period-half" aria-pressed="false">per 6 months</button>
      <span class="grow"></span>
      <a class="mini" id="movements-csv" href="/export/movements.csv?period=week">export csv</a>
      <a class="mini" id="movements-xlsx" href="/export/movements.xlsx?period=week">export xlsx</a>
      <a class="mini" id="safety-xlsx" href="/export/safety-stock.xlsx">safety stock xlsx</a>
    </div>
    <div class="scroll-x"><table id="table-movements"></table></div>
  </div>

  <div class="card">
    <h2>Safety sock watch</h2>
    <div class="row">
      <label class="field narrow">
        <span>order cycle days</span>
        <input id="buffer-cycle" type="number" min="1" max="90" step="1" value="7">
      </label>
      <label class="field narrow">
        <span>horizon weeks</span>
        <input id="buffer-horizon" type="number" min="1" max="26" step="1" value="4">
      </label>
      <label class="field narrow" style="justify-content: flex-end">
        <button class="action" id="buffer-apply">RUN</button>
      </label>
      <span class="grow"></span>
      <label class="field narrow" style="justify-content: flex-end">
        <a class="mini" id="buffer-csv" href="/export/ddmrp.csv">export csv</a>
      </label>
      <label class="field narrow" style="justify-content: flex-end">
        <a class="mini" id="buffer-xlsx" href="/export/ddmrp.xlsx">export xlsx</a>
      </label>
    </div>
    <div class="row tight">
      <button class="mini" id="buffer-risky" aria-pressed="true">redzone</button>
      <button class="mini" id="buffer-all" aria-pressed="false">all articles</button>
      <span class="grow"></span>
      <span class="muted" id="buffer-counts"></span>
    </div>
    <div class="scroll-x short-box"><table id="table-buffers"></table></div>
    <div class="scroll-x"><table id="table-chain"></table></div>
    <div id="buffer-note"></div>
  </div>

  <div class="card">
    <h2>Dots orders</h2>
    <div class="row">
      <label class="field grow">
        <span>site</span>
        <input id="order-site">
      </label>
      <label class="field grow">
        <span>work item</span>
        <input id="order-work">
      </label>
    </div>
    <div class="row">
      <button class="action" id="ask-dots">ask dots</button>
      <button class="action ghost" id="drop-draft" hidden>discard</button>
    </div>
    <div id="dots-note"></div>
    <div id="draft" hidden>
      <div class="scroll-x"><table id="table-draft"></table></div>
      <p class="legend" id="draft-reason"></p>
      <div class="row">
        <button class="action" id="save-draft">save as purchase order</button>
      </div>
    </div>
  </div>
</div>

<nav class="fkeys" id="fkeys" aria-label="Function keys"></nav>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key.includes("-")) node.setAttribute(key, value);
    else node[key] = value;
  }
  for (const child of children) node.append(child);
  return node;
}

const SVG = "http://www.w3.org/2000/svg";

function svg(tag, props = {}, children = []) {
  const node = document.createElementNS(SVG, tag);
  for (const [key, value] of Object.entries(props)) node.setAttribute(key, value);
  for (const child of children) node.append(child);
  return node;
}

const showNum = (value) => (value == null || isNaN(value) ? "—" : Number(value).toLocaleString());
const short = (text, size = 22) =>
  String(text ?? "").length > size ? `${String(text).slice(0, size - 1)}…` : String(text ?? "");

function notice(target, kind, text) {
  target.replaceChildren(text ? el("p", { className: `notice ${kind}`, textContent: text }) : "");
  target.hidden = !text;
}

async function api(path, options) {
  const response = await fetch(path, options);
  let payload = null;
  try {
    payload = await response.json();
  } catch {
  }
  if (!response.ok) throw new Error(payload?.detail ?? `Error ${response.status}`);
  return payload;
}

const jsonBody = (method, body) => ({
  method,
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body),
});

const QUIET_TYPES = new Set(["number", "date", "password", "file", "checkbox", "radio",
                             "range", "color", "hidden"]);

function shout(event) {
  const box = event.target;
  if (box.tagName !== "INPUT" && box.tagName !== "TEXTAREA") return;
  if (QUIET_TYPES.has(box.type)) return;
  const loud = box.value.toUpperCase();
  if (loud === box.value) return;
  const start = box.selectionStart;
  const end = box.selectionEnd;
  box.value = loud;
  try {
    box.setSelectionRange(start, end);
  } catch {
  }
}

document.addEventListener("input", shout, true);

let plan = null;
let moves = null;
let draft = null;
let period = "week";

function columnChart(points, label, value) {
  const width = 640;
  const height = 170;
  const pad = { left: 34, right: 8, top: 10, bottom: 26 };
  const top = Math.max(...points.map(value), 1);
  const plotWidth = width - pad.left - pad.right;
  const plotHeight = height - pad.top - pad.bottom;
  const step = plotWidth / Math.max(points.length, 1);
  const parts = [];

  points.forEach((point, index) => {
    const tall = (value(point) / top) * plotHeight;
    const x = pad.left + index * step + step * 0.2;
    const barWidth = Math.max(step * 0.6, 2);
    parts.push(svg("rect", {
      class: "bar", x, width: barWidth,
      y: pad.top + plotHeight - tall, height: Math.max(tall, 1),
    }));
    parts.push(svg("text", {
      x: x + barWidth / 2, y: height - 14, "text-anchor": "middle",
    }, [label(point)]));
    if (value(point) > 0) {
      parts.push(svg("text", {
        class: "value", x: x + barWidth / 2, y: pad.top + plotHeight - tall - 3,
        "text-anchor": "middle",
      }, [showNum(Math.round(value(point)))]));
    }
  });

  return svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" }, [
    svg("line", {
      class: "axis", x1: pad.left, y1: pad.top + plotHeight, x2: width - pad.right,
      y2: pad.top + plotHeight,
    }),
    svg("text", { x: 0, y: pad.top + 8 }, [showNum(Math.round(top))]),
    ...parts,
  ]);
}

function barList(points, label, value) {
  const width = 640;
  const rowHeight = 20;
  const pad = { left: 150, right: 42, top: 6 };
  const height = pad.top + points.length * rowHeight + 6;
  const top = Math.max(...points.map(value), 1);
  const plotWidth = width - pad.left - pad.right;
  const parts = [];

  points.forEach((point, index) => {
    const y = pad.top + index * rowHeight;
    const long = Math.max((value(point) / top) * plotWidth, 1);
    parts.push(svg("text", { x: 0, y: y + 12 }, [short(label(point))]));
    parts.push(svg("rect", { class: "track", x: pad.left, y: y + 3, width: plotWidth, height: 12 }));
    parts.push(svg("rect", { class: "bar", x: pad.left, y: y + 3, width: long, height: 12 }));
    parts.push(svg("text", {
      class: "value", x: width - pad.right + 4, y: y + 13,
    }, [showNum(value(point))]));
  });

  return svg("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" }, parts);
}

function renderTable(table, columns, data, empty) {
  table.replaceChildren();
  if (!data.length) {
    table.append(el("tbody", {}, [el("tr", {}, [el("td", { className: "muted",
                                                          textContent: empty })])]));
    return;
  }
  table.append(el("thead", {}, [
    el("tr", {}, columns.map((col) => el("th", { textContent: col.label }))),
  ]));
  table.append(el("tbody", {}, data.map((item) =>
    el("tr", {}, columns.map((col) => {
      const cell = el("td", { className: col.numeric ? "num" : "" });
      cell.append(col.cell(item));
      return cell;
    })))));
}

function renderCharts() {
  const weeks = plan.weeks ?? [];
  $("weeks-chart").replaceChildren(weeks.length
    ? columnChart(weeks, (week) => week.week.slice(5), (week) => week.quantity)
    : el("p", { className: "muted", textContent: "No delivery note yet." }));

  const sites = plan.sites ?? [];
  $("sites-chart").replaceChildren(sites.length
    ? barList(sites, (site) => site.site, (site) => site.lines)
    : el("p", { className: "muted", textContent: "No site named yet." }));
}

function renderMovements() {
  const head = ["Period", "Quantity in", "Lines in", "Quantity out", "Lines out", "Net"];
  const rows = moves.rows ?? [];
  $("table-movements").replaceChildren(
    el("thead", {}, [el("tr", {}, head.map((name) => el("th", { textContent: name })))]),
    el("tbody", {}, rows.length
      ? rows.map((row) => el("tr", {}, [
          el("td", {}, [el("strong", { textContent: row.label })]),
          el("td", { className: "num", textContent: showNum(row.in_quantity) }),
          el("td", { className: "num", textContent: showNum(row.in_lines) }),
          el("td", { className: "num", textContent: showNum(row.out_quantity) }),
          el("td", { className: "num", textContent: showNum(row.out_lines) }),
          el("td", { className: "num", textContent: showNum(row.net) }),
        ]))
      : [el("tr", {}, [el("td", { colSpan: head.length, className: "muted",
                                  textContent: "Nothing booked in yet." })])]),
    el("tfoot", {}, [el("tr", {}, [
      el("th", { textContent: "total" }),
      el("th", { className: "num", textContent: showNum(moves.totals.in_quantity) }),
      el("th", {}),
      el("th", { className: "num", textContent: showNum(moves.totals.out_quantity) }),
      el("th", {}),
      el("th", { className: "num", textContent: showNum(moves.totals.net) }),
    ])]),
  );

  for (const name of ["week", "month", "half"]) {
    $(`period-${name}`).setAttribute("aria-pressed", String(name === period));
  }
  $("movements-csv").href = `/export/movements.csv?period=${period}`;
  $("movements-xlsx").href = `/export/movements.xlsx?period=${period}`;
}

let buffers = null;
let bufferAll = false;

function bufferRules() {
  return {
    cycle: Number($("buffer-cycle").value) || 7,
    horizon: Number($("buffer-horizon").value) || 4,
  };
}

function zonePill(zone) {
  const words = { red: "red", yellow: "yellow", green: "green", over: "over the top",
                  uncounted: "not counted" };
  return el("span", { className: `pill ${zone}`, textContent: words[zone] ?? zone });
}

function drawBuffers() {
  if (!buffers) return;
  const rows = bufferAll
    ? buffers.articles
    : buffers.articles.filter((row) => row.zone === "red" || row.zone === "yellow");

  renderTable($("table-buffers"), [
    {
      label: "Article",
      cell: (row) => {
        const box = el("span", {}, [el("strong", { textContent: row.article })]);
        const under = [row.supplier, `${row.lead_class} lead ${showNum(row.lead_days)} d`,
                       row.variability].filter(Boolean).join(" · ");
        box.append(el("div", { className: "desig muted", textContent: under }));
        return box;
      },
    },
    { label: "weekly avg cons", numeric: true, cell: (row) => showNum(row.per_week) },
    { label: "Red", numeric: true, cell: (row) => showNum(row.red) },
    { label: "Yellow", numeric: true, cell: (row) => showNum(row.yellow) },
    { label: "Green", numeric: true, cell: (row) => showNum(row.green) },
    { label: "Top", numeric: true, cell: (row) => showNum(row.top_of_green) },
    { label: "Net flow", numeric: true, cell: (row) => showNum(row.net_flow) },
    { label: "Buffer", numeric: true, cell: (row) => `${showNum(row.buffer_share)}%` },
    { label: "Zone", cell: (row) => zonePill(row.zone) },
    { label: "To order", numeric: true, cell: (row) => (row.to_order ? showNum(row.to_order) : "—") },
    { label: "Spike risk", numeric: true, cell: (row) => `${showNum(row.spike_risk)}%` },
  ], rows, bufferAll ? "Nothing stored yet." : "No article in the red or the yellow.");

  const counts = buffers.counts;
  $("buffer-counts").textContent =
    `${counts.articles} article(s) · ${counts.red} red · ${counts.yellow} yellow · `
    + `${counts.green} green · ${counts.uncounted} not counted`;
  $("buffer-risky").setAttribute("aria-pressed", String(!bufferAll));
  $("buffer-all").setAttribute("aria-pressed", String(bufferAll));

  const chain = buffers.chain;
  const states = chain.states;
  renderTable($("table-chain"), [
    { label: "This week", cell: (state) => el("strong", { textContent: state }) },
    ...states.map((next) => ({
      label: `→ ${next}`,
      numeric: true,
      cell: (state) => `${Math.round(100 * (chain.matrix[state]?.[next] ?? 0))}%`,
    })),
  ], states, "");

  const share = states
    .map((state) => `${state} ${Math.round(100 * (chain.steady[state] ?? 0))}%`)
    .join(" · ");
  notice($("buffer-note"), buffers.thin ? "warn" : "",
    `${chain.transitions} week to week move(s) counted.`);

  const { cycle, horizon } = bufferRules();
  $("buffer-csv").href = `/export/ddmrp.csv?cycle=${cycle}&horizon=${horizon}`;
  $("buffer-xlsx").href = `/export/ddmrp.xlsx?cycle=${cycle}&horizon=${horizon}`;
}

async function renderBuffers() {
  const { cycle, horizon } = bufferRules();
  try {
    buffers = await api(`/api/ddmrp?cycle=${cycle}&horizon=${horizon}`);
  } catch (e) {
    notice($("buffer-note"), "bad", e.message);
    return;
  }
  drawBuffers();
}

$("buffer-apply").addEventListener("click", renderBuffers);
$("buffer-all").addEventListener("click", () => { bufferAll = true; drawBuffers(); });
$("buffer-risky").addEventListener("click", () => { bufferAll = false; drawBuffers(); });

function renderDraft() {
  $("draft").hidden = draft == null;
  $("drop-draft").hidden = draft == null;
  if (!draft) return;

  const head = ["Article", "Quantity", "Unit", "Supplier", "Why"];
  $("table-draft").replaceChildren(
    el("thead", {}, [el("tr", {}, head.map((name) => el("th", { textContent: name })))]),
    el("tbody", {}, draft.lines.map((line, index) => {
      const quantity = el("input", {
        className: "cell", type: "number", step: "any", min: "0", value: line.quantity,
      });
      quantity.addEventListener("change", () => {
        draft.lines[index].quantity = Number(quantity.value) || 0;
      });
      return el("tr", {}, [
        el("td", {}, [
          el("div", {}, [el("strong", { textContent: line.article })]),
          line.reference
            ? el("div", { className: "desig", textContent: line.reference })
            : el("span"),
        ]),
        el("td", { className: "num" }, [quantity]),
        el("td", { textContent: line.unit ?? "—" }),
        el("td", { textContent: line.supplier ?? "—" }),
        el("td", { className: "desig", textContent: line.reason }),
      ]);
    })),
  );
  $("draft-reason").textContent = draft.note
    ? `${draft.note} — drafted by ${draft.model} from ${draft.drafted_from} article(s).`
    : `Drafted by ${draft.model} from ${draft.drafted_from} article(s).`;
}

async function renderDots() {
  try {
    const data = await api("/api/models");
    const dots = (data.providers ?? []).find((provider) => provider.id === "openai");
    $("ask-dots").disabled = !dots || dots.state === "missing";
  } catch {
    $("ask-dots").disabled = true;
  }
}

async function loadMovements() {
  try {
    moves = await api(`/api/movements?period=${period}`);
  } catch (e) {
    notice($("top-notice"), "bad", e.message);
    return;
  }
  renderMovements();
}

async function loadPlan(options = {}) {
  try {
    plan = await api("/api/forecast");
  } catch (e) {
    notice($("top-notice"), "bad", e.message);
    return;
  }
  if (!options.keepDraft) draft = null;

  renderCharts();
  renderDraft();
  renderBuffers();
}

function load(options) {
  return Promise.all([loadPlan(options), loadMovements()]);
}

$("reload").addEventListener("click", () => load());
$("drop-draft").addEventListener("click", () => { draft = null; renderDraft(); });

function showPeriod(name) {
  period = name;
  return loadMovements();
}

for (const name of ["week", "month", "half"]) {
  $(`period-${name}`).addEventListener("click", () => showPeriod(name));
}

$("ask-dots").addEventListener("click", async () => {
  const button = $("ask-dots");
  button.disabled = true;
  notice($("dots-note"), "", "Dots is reading the numbers...");
  try {
    draft = await api("/api/forecast/draft", jsonBody("POST", {
      site: $("order-site").value.trim() || null,
      work_item: $("order-work").value.trim() || null,
    }));
    notice($("dots-note"), "ok", `${draft.lines.length} line(s) drafted. Check them, then save.`);
    renderDraft();
  } catch (e) {
    notice($("dots-note"), "bad", e.message);
  } finally {
    button.disabled = false;
  }
});

$("save-draft").addEventListener("click", async () => {
  if (!draft) return;
  const button = $("save-draft");
  const lines = draft.lines
    .filter((line) => line.quantity > 0)
    .map((line) => ({
      article: line.article,
      designation: line.reason || null,
      reference: line.reference || null,
      quantity: line.quantity,
      in_stock: false,
    }));
  if (!lines.length) {
    notice($("dots-note"), "warn", "Every line is at zero. Nothing to save.");
    return;
  }

  button.disabled = true;
  try {
    const answer = await api("/api/orders", jsonBody("POST", {
      list: {
        list_date: new Date().toISOString().slice(0, 10),
        site: $("order-site").value.trim() || null,
        work_item: $("order-work").value.trim() || null,
        drafter: "DOTS",
        lines,
      },
    }));
    notice($("dots-note"), "ok",
      `Saved as purchase order #${answer.list_id}. It is in the Purchase orders tab now.`);
    draft = null;
    renderDraft();
    await load();
  } catch (e) {
    notice($("dots-note"), "bad", e.message);
  } finally {
    button.disabled = false;
  }
});

function download(href) {
  window.location.href = href;
}

function backToMain() {
  window.close();
  window.setTimeout(() => {
    if (!window.closed) window.location.href = "/";
  }, 150);
}

const FKEYS = [
  ["F1", "Refresh", () => load()],
  ["F2", "Week", () => showPeriod("week")],
  ["F3", "Month", () => showPeriod("month")],
  ["F4", "6 months", () => showPeriod("half")],
  ["F5", "Export CSV", () => download($("movements-csv").href)],
  ["F6", "Export XLSX", () => download($("movements-xlsx").href)],
  ["F7", "Safety stock", () => download($("safety-xlsx").href)],
  ["F8", "Ask Dots", () => $("ask-dots").click()],
  ["F9", "Main menu", backToMain],
];

$("fkeys").replaceChildren(...FKEYS.map(([key, label, action]) => {
  const button = el("button", { className: "fkey", type: "button", title: `${key} = ${label}` }, [
    el("b", { textContent: key }),
    el("span", { textContent: `=${label}` }),
  ]);
  button.addEventListener("click", action);
  return button;
}));

document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.altKey || event.metaKey) return;
  const entry = FKEYS.find(([key]) => key === event.key);
  if (!entry) return;
  event.preventDefault();
  entry[2]();
});

renderDots();
load();
</script>
